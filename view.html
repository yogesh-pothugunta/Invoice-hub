<style>

.mut{color:var(--mut)}small{font-size:13px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--box);border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}

.meta dt{color:#5B6B82}.meta dd{margin:0;font-weight:700;text-align:right}
.tw{overflow-x:auto;margin-top:14px}
.it{width:100%;border-collapse:collapse;font-size:13px}

.sum2 dd{margin:0;text-align:right}

.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.vt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.vb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
