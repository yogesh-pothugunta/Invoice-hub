<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>Invoice | InvoiceHub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

h1{font-size:clamp(24px,5vw,32px);font-weight:800}h2{font-size:clamp(20px,4vw,26px);font-weight:800}h3{font-size:17px;font-weight:700}
p{margin:0}a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mut{color:var(--mut)}small{font-size:13px}
.logo{font:800 21px "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:9px;text-decoration:none}
.logo i{width:28px;height:28px;border-radius:9px 9px 9px 3px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:7px;top:8px;width:14px;height:3px;background:#fff;border-radius:2px;box-shadow:0 5px 0 #fff,0 10px 0 var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pri),#0E9F8E);color:#fff;box-shadow:0 8px 18px -10px var(--pri);transition:transform .15s,box-shadow .2s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:hover{box-shadow:0 12px 22px -10px var(--pri)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--sf);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.d{background:var(--sf);color:var(--coral);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:wait}

.inv{--band:#10233F;--bi:#fff;--rule:#10233F;--box:#E9EEF6;--hd:#10233F;--hi:#fff;--ac:#10233F;--ai:#fff;background:#fff;color:#10233F;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ib{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:var(--band);color:var(--bi);border-bottom:4px solid var(--rule)}

.ib .nm{font:800 19px "Bricolage Grotesque",sans-serif;overflow-wrap:anywhere}
.ib .tt{font:800 clamp(22px,6vw,32px) "Bricolage Grotesque",sans-serif;letter-spacing:.05em}
.ip{padding:18px 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--box);border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.box b{display:block;font-size:11px;letter-spacing:.07em;color:#5B6B82;margin-bottom:2px}
.meta{display:grid;grid-template-columns:auto auto;gap:3px 18px;justify-content:end;margin:16px 0 0;font-size:13px}
.meta dt{color:#5B6B82}.meta dd{margin:0;font-weight:700;text-align:right}
.tw{overflow-x:auto;margin-top:14px}
.it{width:100%;border-collapse:collapse;font-size:13px}
.it th{background:var(--hd);color:var(--hi);padding:8px;text-align:right;font-weight:700;white-space:nowrap}
.it td{padding:8px;border-bottom:1px solid #D9E2EC;text-align:right;white-space:nowrap}
.it th:first-child,.it td:first-child{text-align:left;white-space:normal;overflow-wrap:break-word;word-break:normal;min-width:96px}
.sum2{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:end;margin:12px 0 8px;font-size:14px}
.sum2 dd{margin:0;text-align:right}
.due{display:flex;justify-content:space-between;gap:16px;background:var(--ac);color:var(--ai);border-radius:6px;padding:11px 14px;font-weight:800;margin-left:auto;max-width:340px}
.pay{display:flex;gap:14px;align-items:center;margin-top:18px;font-size:13px}
.nt{font-size:13px;margin:16px 0 0;overflow-wrap:anywhere}.nt b{font-size:11px;letter-spacing:.07em;color:#5B6B82}

.hs{color:#5B6B82;font-size:11px}.stampr{text-align:right;margin:10px 0 0}.stamp{display:inline-block;border:3px solid #12A150;color:#12A150;font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.12em;padding:2px 14px;border-radius:8px;transform:rotate(-6deg)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.vt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.vb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
</style>
</head>
